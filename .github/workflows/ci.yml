name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # The workspace is compiled for the runner's host target only. Firmware
      # binaries are feature-gated, so no hardware or bare-metal target is
      # required for this CI job.
      - name: Build Rust workspace
        run: cargo build --workspace --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/python/requirements.txt

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r tests/python/requirements.txt

      - name: Build and install Python extension
        run: |
          python -m pip install maturin
          python -m maturin build --release --locked --manifest-path python/openkey_core/Cargo.toml --interpreter python --out /tmp/openkey-wheels
          test -n "$(find /tmp/openkey-wheels -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m pip install --force-reinstall /tmp/openkey-wheels/*.whl

      - name: Run Python tests
        env:
          PYTHONPATH: targets/simulator/python:tests/python
        run: python -m pytest tests/python
