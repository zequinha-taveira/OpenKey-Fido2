[package]
name = "openkey-storage"
version.workspace = true
edition.workspace = true
description = "Credential and secure storage abstractions for OpenKey"
license.workspace = true

[lib]
name = "storage"

[dependencies]
crypto = { package = "openkey-crypto", path = "../openkey-crypto", version = "0.1.1", default-features = false }
log.workspace = true
ciborium = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror = { workspace = true, default-features = false }
zeroize.workspace = true
serde_json = { version = "1.0", optional = true }

[features]
default = ["std"]
std = ["dep:serde_json", "crypto/std"]
