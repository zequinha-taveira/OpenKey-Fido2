[package]
name = "rp2350-firmware"
version = "0.1.1"
edition = "2021"
description = "Bare-metal boot application for the RP2350 (FIDO2 authenticator firmware skeleton)"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/zequinha-taveira/openkey-fido2"
repository = "https://github.com/zequinha-taveira/openkey-fido2"
publish = false

# Identidade USB opcional para reconhecimento automático por ferramentas
# da Yubico (ykman / Yubico Authenticator), que casam por VID/PID.
#
# The default USB identity pid.codes is 0x1209:0x0001; the YubiKey USB identity
# that ykman / Yubico Authenticator auto-recognize is the opt-in VID:PID=Yubikey5
# build, not for distribution.
#
# ATENÇÃO: usa o VID/PID da Yubico — uso restrito a testes privados;
# NÃO PARA DISTRIBUIÇÃO. Builds publicados devem usar a identidade
# pid.codes padrão do projeto. `yubikey4-identity` é alias de
# `yubikey5-identity` para cobrir a família YubiKey 4/5 (mesmo 1050:0407,
# ADR-0025) e o profile `YUBIKEY_4_5` (Vendor Yubikey 4/5).
[features]
firmware = []
yubikey5-identity = []
yubikey4-identity = ["yubikey5-identity"]

# Biblioteca mínima com geometria pura da região de flash (sem deps de alvo),
# permitindo testes de unidade em host via `cargo test -p rp2350-firmware --lib`.
[lib]
path = "src/lib.rs"
test = true

[[bin]]
name = "rp2350-firmware"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies.board-generic]
package = "openkey-hal"
path = "../../crates/openkey-hal"
version = "0.1.1"

# Dependências do binário bare-metal — TODAS restritas a alvos ARM (a lib
# de geometria é pura e testa em host; ver [lib] acima).
[target.'cfg(target_arch = "arm")'.dependencies]
# Identidade USB (presets openkey/yubikey5 — fonte única em device-profile).
device = { package = "openkey-device", path = "../../crates/openkey-device", version = "0.1.1", default-features = false }
# Stack do autenticador: applets Yubico (OATH/Management) para o roteador
# CCID. Sem `rs256` (RSA exige rand/std) e sem `std` — alvo bare-metal.
openkey-core = { package = "openkey-core", path = "../../crates/openkey-core", version = "0.1.1", default-features = false }
crypto = { package = "openkey-crypto", path = "../../crates/openkey-crypto", version = "0.1.1", default-features = false }
storage = { package = "openkey-storage", path = "../../crates/openkey-storage", version = "0.1.1", default-features = false }
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
embedded-alloc = "0.7"
embedded-hal = "1.0"
rp235x-hal = { version = "0.4.0", features = ["binary-info", "critical-section-impl", "rt"] }
transport = { package = "openkey-transport", path = "../../crates/openkey-transport", version = "0.1.1", default-features = false, features = ["embedded", "usb-device"] }
usb-device = "0.3"
# getrandom com feature "custom" (sem defaults = sem std): unificação habilita
# "custom" TAMBÉM na cópia usada pelo ring, contornando o compile_error do
# alvo. O registro da implementação custom fica em src/main.rs.
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
ring = { version = "0.17", default-features = false }
